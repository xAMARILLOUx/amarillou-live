  if(oldVersion<4){x.pointSources[id]={...emptyPoints(),legacy:x.points[id]};continue;}
  const b=input?.[id];if(!b)throw Error('Backup sem a origem dos pontos.');
  const clean=emptyPoints();for(const k of POINT_SOURCES){if(typeof b[k]!=='number'||!Number.isFinite(b[k])||b[k]<0)throw Error('Origem dos pontos inválida.');clean[k]=b[k];}

function parseLiveDuration(value){

function giftRankingView(s,kind,overrides={}){

 return `<div ${cardAttrs(v,'rank-card gift-rank-card')}><div class="overlay-kicker">TOP ${v.rankLimit||10} HISTÓRICO</div><h2>${combos?'Maiores combos':'Presentes mais caros'}</h2>${rows.map((r,i)=>{const u=s.users[r.userId];return `<div class="rank-row"><b class="position">${i+1}</b>${avatar(u)}<div class="person"><strong>${esc(u?.name)}</strong><small>@${esc(u?.handle||r.userId.slice(1))}</small><small>${esc(r.name)}</small></div>${r.image?`<img class="record-gift" src="${esc(r.image)}" alt="">`:''}<b class="score">${combos?'×':''}${fmt(combos?r.count:r.unit)}<small>${combos?'combo':'moedas'}</small></b></div>`;}).join('')||'<p class="overlay-empty">Aguardando presentes</p>'}</div>`;
}
function overlayView(s,params){const kind=params.get('kind')||'ranking',v={};if(params.has('container'))v.container=params.get('container')!=='0';if(params.has('color'))v.color=validColor(params.get('color'));if(params.has('level'))v.showLevel=params.get('level')!=='0';if(params.has('style'))v.style=params.get('style');
 if(params.has('layout'))v.layout=params.get('layout')==='horizontal'?'horizontal':'vertical';if(params.has('rankLimit'))v.rankLimit=[1,3,5,10].includes(Number(params.get('rankLimit')))?Number(params.get('rankLimit')):10;
 if(kind==='chest')return chestView(s);
 if(kind==='ranking')return rankView(s,{period:['day','week','month'].includes(params.get('period'))?params.get('period'):'day',metric:params.get('metric')==='likes'?'likes':'coins',limit:Math.min(20,Math.max(1,Number(params.get('limit'))||5)),start:params.get('start')||'',end:params.get('end')||'',...v});
 if(['topCombos','topGifts'].includes(kind))return giftRankingView(s,kind,v);
 if(kind==='roles')return `<div class="overlay-duo">${roleView(s,'hero',v)}${roleView(s,'villain',v)}</div>`;
 if(['hero','villain'].includes(kind))return roleView(s,kind,v);
 if(['goal','giftGoal','followers','lastFollower','timer'].includes(kind))return widgetView(s,kind,v);
 return giftView(s,Object.hasOwn(giftTitles,kind)?kind:'last',v);
}

  }
  e.ingest({event:'gift',data:{userId:'luna',uniqueId:'luna',nickname:'Luna Costa',giftId:'rose',giftName:'Rosa',diamondCount:1,repeatCount:50,giftType:1,repeatEnd:true,groupId:'demo-streak',msgId:'combo-demo'}});
  e.ingest({event:'follow',data:{userId:'mari',uniqueId:'mari',nickname:'Mariana',msgId:'demo-follow'}});
  e.state.extra.goal.current=48300;e.state.extra.goal.target=50000;

}

// overlay.js
const params=new URLSearchParams(location.search),token=new URLSearchParams(location.hash.slice(1)).get('key');
const root=document.querySelector('#overlay-root'),badge=document.querySelector('#overlay-status');
// Scale the complete composition, keeping names and scores together.
function composeOverlay(){
 const card=root.querySelector('.rank-card'),rows=card?[...card.querySelectorAll(':scope > .rank-row')]:[];
 const horizontal=card?.dataset.rankLayout==='horizontal'&&rows.length>1;
 root.classList.toggle('wide-ranking',horizontal);
 if(horizontal){
  const grid=document.createElement('div');grid.className='overlay-rank-columns';
  grid.style.gridTemplateRows='repeat('+Math.ceil(rows.length/2)+', auto)';
  rows[0].before(grid);grid.append(...rows);
 }
}
function fitOverlay(){
 const content=root.firstElementChild;if(!content)return;
 const chest=root.querySelector('[data-chest-width]');if(chest)root.style.width=chest.dataset.chestWidth+'px';
 const width=root.offsetWidth,height=root.offsetHeight;
 const scale=Math.min(chest?1:Infinity,768/Math.max(width,1),552/Math.max(height,1));
 root.style.transform='translate(-50%, -50%) scale('+scale+')';
}
new ResizeObserver(fitOverlay).observe(root);
root.addEventListener('load',fitOverlay,true);
window.addEventListener('resize',fitOverlay);
let lastPacket=0,current=freshState(),lastHTML='';
function render(){const html=overlayView(current,params);if(html!==lastHTML){root.innerHTML=html;composeOverlay();watchImages(root);lastHTML=html;fitOverlay();}}
function receive(packet){if(packet.state?.version!==7||!packet.state?.extra){badge.hidden=false;badge.textContent='Atualize o painel ou a ponte para v0.8.';return;}current=packet.state;lastPacket=Date.now();render();badge.hidden=packet.status?.code==='connected';badge.textContent=packet.saveError?'Falha ao salvar histórico':packet.status?.message || 'Painel desconectado';if(packet.saveError)badge.hidden=false;}
if(params.get('demo')==='1'){
  current=demoState();render();badge.textContent='DEMONSTRAÇÃO';
}else if(token && location.hostname==='127.0.0.1'){
  async function poll(){try{const r=await fetch('./api/state',{headers:{Authorization:'Bearer '+token},cache:'no-store',signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error('Link inválido. Copie novamente no painel.');receive(await r.json());}catch(e){badge.hidden=false;badge.textContent='Sem ponte local · '+e.message;}setTimeout(poll,1000);}void poll();
}else{
  try{const cached=await loadState();if(cached)current=validateState(cached);}catch{}
  render();
  let channel=null;try{if(typeof BroadcastChannel!=='undefined')channel=new BroadcastChannel(channelName);}catch{}
  if(channel){channel.onmessage=e=>{if(e.data?.type==='snapshot')receive(e.data);};channel.postMessage({type:'request'});}
  badge.textContent='Abra o painel no mesmo navegador. Para OBS, use o link do modo local.';
}
setInterval(()=>{render();if(params.get('demo')!=='1' && lastPacket && Date.now()-lastPacket>7000){badge.hidden=false;badge.textContent='Sem atualização · confira o painel ou a ponte local';}},1000);

window.__amarillouReady=true;
}catch(error){window.__amarillouFailure(error);}
})();</script></body></html>
