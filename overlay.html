  if(reset?.calendar===start)for(const [id,value] of totals)totals.set(id,Math.max(0,value-(reset.baseline[id]||0)));
  return [...totals].filter(([,value])=>value>0).map(([id,value])=>({...s.users[id],id,value}))
    .sort((a,b)=>b.value-a.value || a.id.localeCompare(b.id));
}
function resolveRole(s, role) {
  const r=s.roles[role]; const user=Object.values(s.users).find(u=>u.handle && u.handle===r.handle);
  return {handle:r.handle,name:r.name || user?.name || r.handle,avatar:r.avatar || user?.avatar || ''};
}
function setRole(s, role, input) {
  if (!['hero','villain'].includes(role)) throw Error('Papel inválido');
  s.roles[role] = {handle:handle(input.handle),name:clean(input.name),avatar:imageURL(input.avatar)};
  s.updatedAt=Date.now();
}
function validateState(input) {
  // Rebuild dictionaries instead of merging arbitrary imported properties.
  if (!input || ![1,2,3,4,5,VERSION].includes(input.version) || !input.users || !input.days || !input.roles) throw Error('Backup incompatível ou inválido.');
  const s=freshState();
  try { new Intl.DateTimeFormat('pt-BR',{timeZone:input.settings?.zone}).format(); } catch {throw Error('Fuso inválido no backup.');}
  s.settings.zone=input.settings?.zone || s.settings.zone;
  if (input.settings?.endpoint) s.settings.endpoint=validateEndpoint(input.settings.endpoint);
  s.createdAt=timestamp(input.createdAt); s.updatedAt=timestamp(input.updatedAt);
  if (Object.keys(input.users).length>100000) throw Error('Backup excede 100 mil participantes.');
  for (const [id,u] of Object.entries(input.users)) {
    if (!id.startsWith('$') || !u || typeof u!=='object') throw Error('Participante inválido.');
    s.users[id]={id:clean(u.id),handle:handle(u.handle),name:clean(u.name),avatar:imageURL(u.avatar),lastSeen:timestamp(u.lastSeen)};
  }
  for (const [day,rows] of Object.entries(input.days)) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !rows || typeof rows!=='object') throw Error('Data inválida.');
    s.days[day]={};
    for (const [id,row] of Object.entries(rows)) {
      if (!s.users[id] || !row) throw Error('Ranking sem participante.');
      for (const k of ['likes','coins','gifts']) if (!Number.isSafeInteger(row[k]) || row[k]<0) throw Error('Contagem inválida.');
      s.days[day][id]={likes:row.likes,coins:row.coins,gifts:row.gifts};
    }
  }
  for (const role of ['hero','villain']) setRole(s,role,input.roles[role] || {});
  const h=input.highlights;
  if (h && /^\d{4}-\d{2}-\d{2}$/.test(h.day)) {
    s.highlights.day=h.day;
    for (const k of ['last','recentCombo','bestCombo','expensive']) {
      const g=h[k]; if(g && s.users[g.userId]) s.highlights[k]={userId:g.userId,name:clean(g.name),image:imageURL(g.image),unit:g.unit===null?null:number(g.unit),count:number(g.count),time:timestamp(g.time)};
    }
  }
  for (const [id,t] of Object.entries(input.seen || {}).slice(-12000)) if(id.startsWith('$')) s.seen[id]=timestamp(t);
  for (const [id,v] of Object.entries(input.streaks || {}).slice(-5000)) if(id.startsWith('$') && v) s.streaks[id]={count:number(v.count),time:timestamp(v.time),end:v.end===true};
  for (const k of ['received','accepted','duplicates','unknown','invalid','unpriced','lastEvent']) s.diagnostics[k]=number(input.diagnostics?.[k]);
  s.diagnostics.lastEvent=timestamp(input.diagnostics?.lastEvent);
  for (const [k,v] of Object.entries(input.diagnostics?.types || {}).slice(0,100)) if(k.startsWith('$')) s.diagnostics.types[k]=number(v);
  if(input.version>=2&&!input.extra)throw Error('Backup incompleto.');
  s.extra=validateExtras(s,input.extra,input.version);
  return s;
}
function validateEndpoint(value) {
  const u=new URL(value);
  if (!['ws:','wss:'].includes(u.protocol) || !['localhost','127.0.0.1','[::1]'].includes(u.hostname) || u.username || u.password) throw Error('Use um WebSocket local: ws://localhost:21213/');
  return u.href;
}

// connection.js
class TikFinityConnection {
  constructor(onMessage,onStatus) {this.onMessage=onMessage;this.onStatus=onStatus;this.running=false;this.attempt=0;this.generation=0;}
  start(endpoint) {this.stop();this.endpoint=validateEndpoint(endpoint);this.running=true;this.open(this.generation);}
  open(generation) {
    if (!this.running || generation!==this.generation) return;
    this.onStatus('connecting','Conectando ao TikFinity…');
    try {this.socket=new WebSocket(this.endpoint);} catch(e) {this.onStatus('error','Conexão bloqueada. Confira o endereço e as permissões locais.');this.retry(generation);return;}
    const ws=this.socket;
    const timeout=setTimeout(()=>{if(ws.readyState!==1) ws.close();},10000);
    ws.onopen=()=>{clearTimeout(timeout);if(generation!==this.generation)return;this.attempt=0;this.onStatus('connected','TikFinity conectado · aguardando eventos da live');};
    ws.onmessage=e=>{if(generation===this.generation && typeof e.data==='string')this.onMessage(e.data);};
    ws.onerror=()=>{if(generation===this.generation)this.onStatus('error','Não foi possível acessar o TikFinity. Confira o aplicativo, a API local e as permissões do navegador.');};
    ws.onclose=()=>{clearTimeout(timeout);if(generation===this.generation && this.running){this.onStatus('reconnecting','Sem conexão · tentando novamente');this.retry(generation);}};
  }
  retry(generation) {clearTimeout(this.timer);this.timer=setTimeout(()=>this.open(generation),Math.min(15000,1000*2**Math.min(this.attempt++,4)));}
  stop() {this.generation++;this.running=false;clearTimeout(this.timer);this.socket?.close();this.onStatus('disconnected','Desconectado');}
}

// storage.js
const dbName='amarillou-live:'+new URL('.',location.href).pathname;
const channelName=dbName;
let db;
async function openDB(){
  if(db)return db;
  db=await new Promise((resolve,reject)=>{let finished=false;const fail=e=>{if(finished)return;finished=true;clearTimeout(timer);reject(e);};const timer=setTimeout(()=>fail(Error('O navegador não liberou o histórico em 5 segundos. Feche outras abas e recarregue.')),5000);let r;try{r=indexedDB.open(dbName,1);}catch(e){fail(e);return;}r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>{if(finished){r.result.close();return;}finished=true;clearTimeout(timer);resolve(r.result);};r.onerror=()=>fail(r.error);r.onblocked=()=>fail(Error('Histórico bloqueado por outra aba. Feche as outras abas do painel.'));});return db;
}
async function loadState(){const d=await openDB();return new Promise((resolve,reject)=>{const r=d.transaction('state').objectStore('state').get('main');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function saveState(s){const d=await openDB();return new Promise((resolve,reject)=>{const tx=d.transaction('state','readwrite');tx.objectStore('state').put(s,'main');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}

// overlay-size.js
// Recommended OBS Browser Source viewport in CSS pixels, with space for status.
// These dimensions describe the source; resize its transform in the OBS scene afterwards.
function overlayDimensions(kind,{container=true,showLevel=true,style='classic',limit=5}={}){
 const boxed=container!==false,n=Math.max(1,Math.min(20,Number(limit)||5));
 if(kind==='ranking')return {width:640,height:Math.ceil(((boxed?200:100)+n*(showLevel!==false?104:84))/20)*20};
 if(['hero','villain','roles'].includes(kind)){
  if(style==='ribbon')return {width:640,height:kind==='roles'?(boxed?580:420):(boxed?280:200)};
  return {width:kind==='roles'?850:400,height:boxed?440:340};
 }
 if(['last','recentCombo','bestCombo','expensive'].includes(kind))return style==='portrait'?{width:360,height:boxed?460:400}:{width:640,height:boxed?360:240};
 if(kind==='goal')return {width:640,height:boxed?260:220};
 if(kind==='timer')return {width:480,height:boxed?240:200};
 if(kind==='followers'||kind==='lastFollower')return {width:640,height:(boxed?160:100)+(kind==='followers'?5:1)*84};
 return {width:640,height:480};
}

// views.js
const fmt=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2}).format(n??0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const periods={day:'do dia',week:'da semana',month:'do mês'};
const giftTitles={last:'Último presente',recentCombo:'Combo recente',bestCombo:'Maior combo',expensive:'Presente mais caro'};
function avatar(user,large=false){return `<span class="avatar ${large?'large':''}"><span>${esc((user?.name||user?.handle||'?').slice(0,2).toUpperCase())}</span>${user?.avatar?`<img alt="" src="${esc(user.avatar)}" loading="lazy">`:''}</span>`;}
function watchImages(root){for(const i of root.querySelectorAll('img')){if(i.complete&&i.naturalWidth===0)i.remove();else i.addEventListener('error',()=>i.remove(),{once:true});}for(const el of root.querySelectorAll('[data-bg]'))el.style.setProperty('--overlay-bg',validColor(el.dataset.bg));}
function visualOf(s,key,override={}){return {...defaultVisual(),...s.extra?.visuals[key],...override};}
function cardAttrs(v,classes){return `class="overlay-card ${classes} ${v.container?'boxed':'bare'} ${v.style==='ribbon'?'ribbon':v.style==='portrait'?'portrait':''}" data-bg="${validColor(v.color)}"`;}
function rankView(s,{period='day',metric='coins',limit=5,start='',end='',...overrides}={}){
 const v=visualOf(s,metric==='likes'?'rankLikes':'rankCoins',overrides);const rows=(start&&end?historicalRanking(s,start,end,metric):ranking(s,period,metric)).slice(0,limit);
 return `<div ${cardAttrs(v,'rank-card')}><div class="overlay-kicker">TOP ${start?'DO PERÍODO':esc(periods[period]||periods.day)}</div><h2>${metric==='likes'?'Quem dá mais likes':'Quem manda mais moedas'}</h2>${rows.length?rows.map((u,i)=>{const l=levelProgress(s.extra?.points[u.id]||0);return `<div class="rank-row"><b class="position">${i+1}</b>${avatar(u)}<div class="person"><strong>${esc(u.name)}</strong><small>@${esc(u.handle||u.id.slice(1))}</small>${v.showLevel?`<span class="level-badge">Nível ${l.level}</span>`:''}</div><b class="score">${fmt(u.value)}<small>${metric==='likes'?'likes':'moedas'}</small></b></div>`;}).join(''):'<p class="overlay-empty">Aguardando os primeiros eventos</p>'}</div>`;
}
function giftView(s,key,overrides={}){const v=visualOf(s,'gifts',overrides),item=s.highlights.day===dayKey(Date.now(),s.settings.zone)?s.highlights[key]:null,user=item?s.users[item.userId]:null;
 const gift=item?(item.image?`<img class="gift-image" alt="${esc(item.name)}" src="${esc(item.image)}">`:'<span class="gift-placeholder">✦</span>'):'';
 const content=!item?'<p class="overlay-empty">Aguardando presente</p>':v.style==='portrait'?`<div class="gift-portrait"><div class="portrait-cluster">${avatar(user,true)}<div class="portrait-accessory">${gift}<b class="portrait-count">×${fmt(item.count)}</b></div></div><div class="portrait-identity"><strong>${esc(user?.name)}</strong><small>@${esc(user?.handle||'')}</small><span>${esc(item.name)}</span></div></div>`:`<div class="gift-content">${gift}<div><h2>${esc(item.name)}</h2><p class="gift-count">×${fmt(item.count)}</p></div></div><div class="gift-donor">${avatar(user)}<div><strong>${esc(user?.name)}</strong><small>${item.unit===null?'Valor em moedas indisponível':`${fmt(item.unit)} moedas por unidade · ${fmt(item.unit*item.count)} no combo`}</small></div></div>`;
 return `<div ${cardAttrs(v,'gift-card')}><div class="overlay-kicker">${esc(giftTitles[key]||'Presente')}</div>${content}</div>`;}
function roleView(s,role,overrides={}){const v=visualOf(s,'roles',overrides),u=resolveRole(s,role),hero=role==='hero';return `<div ${cardAttrs(v,'role-card '+(hero?'hero':'villain'))}><div class="role-topline">${hero?'✦ HERÓI':'✧ VILÃO'} <span>DA LIVE</span></div>${avatar(u,true)}<div class="role-identity"><h2>${esc(u.name||'Quem será?')}</h2><p>${u.handle?'@'+esc(u.handle):'Escolha no painel'}</p>${u.handle&&!u.avatar?'<small class="await-photo">Aguardando foto do participante</small>':''}</div></div>`;}
function clock(ms){const secs=Math.max(0,Math.ceil(ms/1000));return [Math.floor(secs/3600),Math.floor(secs%3600/60),secs%60].map(n=>String(n).padStart(2,'0')).join(':');}
function widgetView(s,kind,overrides={}){const key=['lastFollower','followers'].includes(kind)?'followers':kind,v=visualOf(s,key,overrides);const x=s.extra;let content='';
 if(kind==='goal'){const p=Math.min(100,x.goal.current/x.goal.target*100);content=`<h2>Meta de curtidas</h2><strong class="goal-count">${fmt(x.goal.current)} <small>/ ${fmt(x.goal.target)}</small></strong><progress max="100" value="${p}" aria-label="Progresso da meta"></progress><p>${fmt(p)}% · ${p>=100?'Meta alcançada!':'Cada tap conta'}</p>`;}
 else if(kind==='timer')content=`<div class="overlay-kicker">TEMPORIZADOR</div><strong class="timer-clock">${clock(timerRemaining(x.timer))}</strong><small>${x.timer.running?(timerRemaining(x.timer)>0?'Em andamento':'Tempo esgotado'):'Pausado'}</small>`;
 else content=`<div class="overlay-kicker">${kind==='lastFollower'?'ÚLTIMO SEGUIDOR':'ÚLTIMOS SEGUIDORES'}</div>${x.followers.slice(0,kind==='lastFollower'?1:5).map(f=>{const u=s.users[f.userId];return `<div class="rank-row">${avatar(u)}<div class="person"><strong>${esc(u?.name)}</strong><small>@${esc(u?.handle)}</small></div></div>`;}).join('')||'<p class="overlay-empty">Aguardando novos seguidores</p>'}`;
 return `<div ${cardAttrs(v,'widget-card')}>${content}</div>`;
}
function overlayView(s,params){const kind=params.get('kind')||'ranking',v={};if(params.has('container'))v.container=params.get('container')!=='0';if(params.has('color'))v.color=validColor(params.get('color'));if(params.has('level'))v.showLevel=params.get('level')!=='0';if(params.has('style'))v.style=params.get('style');
 if(kind==='ranking')return rankView(s,{period:['day','week','month'].includes(params.get('period'))?params.get('period'):'day',metric:params.get('metric')==='likes'?'likes':'coins',limit:Math.min(20,Math.max(1,Number(params.get('limit'))||5)),start:params.get('start')||'',end:params.get('end')||'',...v});
 if(kind==='roles')return `<div class="overlay-duo">${roleView(s,'hero',v)}${roleView(s,'villain',v)}</div>`;
 if(['hero','villain'].includes(kind))return roleView(s,kind,v);
 if(['goal','followers','lastFollower','timer'].includes(kind))return widgetView(s,kind,v);
 return giftView(s,Object.hasOwn(giftTitles,kind)?kind:'last',v);
}

// overlay.js
const params=new URLSearchParams(location.search),token=new URLSearchParams(location.hash.slice(1)).get('key');
const root=document.querySelector('#overlay-root'),badge=document.querySelector('#overlay-status');
let lastPacket=0,current=freshState(),lastHTML='';
function render(){const html=overlayView(current,params);if(html!==lastHTML){root.innerHTML=html;watchImages(root);lastHTML=html;}}
function receive(packet){if(packet.state?.version!==6||!packet.state?.extra){badge.hidden=false;badge.textContent='Atualize o painel ou a ponte para v0.7.';return;}current=packet.state;lastPacket=Date.now();render();badge.hidden=packet.status?.code==='connected';badge.textContent=packet.saveError?'Falha ao salvar histórico':packet.status?.message || 'Painel desconectado';if(packet.saveError)badge.hidden=false;}
if(params.get('demo')==='1'){
  current=demoState();render();badge.textContent='DEMONSTRAÇÃO';
}else if(token && location.hostname==='127.0.0.1'){
  async function poll(){try{const r=await fetch('./api/state',{headers:{Authorization:'Bearer '+token},cache:'no-store',signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error('Link inválido. Copie novamente no painel.');receive(await r.json());}catch(e){badge.hidden=false;badge.textContent='Sem ponte local · '+e.message;}setTimeout(poll,1000);}void poll();
}else{
  try{const cached=await loadState();if(cached)current=validateState(cached);}catch{}
  render();
  let channel=null;try{if(typeof BroadcastChannel!=='undefined')channel=new BroadcastChannel(channelName);}catch{}
  if(channel){channel.onmessage=e=>{if(e.data?.type==='snapshot')receive(e.data);};channel.postMessage({type:'request'});}
  badge.textContent='Abra o painel no mesmo navegador. Para OBS, use o link do modo local.';
}
setInterval(()=>{render();if(params.get('demo')!=='1' && lastPacket && Date.now()-lastPacket>7000){badge.hidden=false;badge.textContent='Sem atualização · confira o painel ou a ponte local';}},1000);

window.__amarillouReady=true;
}catch(error){window.__amarillouFailure(error);}
})();</script></body></html>
